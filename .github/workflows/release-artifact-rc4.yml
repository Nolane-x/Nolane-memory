name: release-artifact-rc4

on:
  push:
    branches: ['release/0.6.3rc4']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-verified-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest build
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q src tests examples plugins/deepseek-harness/python
      - run: python examples/basic_runtime.py
      - run: python examples/full_profile.py
      - name: Run rc4 release gate and persist evidence
        run: |
          python - <<'PY'
          import json
          import tempfile
          from dataclasses import asdict
          from pathlib import Path
          from nolane_memory import MemoryRuntime

          with tempfile.NamedTemporaryFile(suffix='.db') as f:
              rt = MemoryRuntime(f.name, clock_authority_id='rc4-ci-clock', clock_epoch='rc4-ci-1')
              rt.create_domain('rc4-ci')
              report = rt.run_full_spec_release_gate(
                  'rc4-ci', seed=603, fuzz_cases=100000,
                  differential_cases=1024, persistence_fuzz_cases=1200,
              )
              assert report.implementation_ready, report.checks
              Path('docs/FULL_SPEC_GATE_RC4.json').write_text(
                  json.dumps(asdict(report), indent=2, sort_keys=True, default=str) + '\n',
                  encoding='utf-8',
              )
              rt.close()
          PY
      - run: python -m build --wheel
      - name: Build deterministic source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path('.')
          out = Path('dist/nolane-memory-v0.6.3rc4-full-runtime.zip')
          excluded_dirs = {'.git', '.pytest_cache', '__pycache__', 'dist', 'build', '.mypy_cache'}
          files = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if any(part in excluded_dirs for part in rel.parts):
                  continue
              if rel.suffix in {'.pyc', '.pyo'}:
                  continue
              files.append((rel.as_posix(), path))
          files.sort()
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, 'w', ZIP_DEFLATED) as zf:
              for rel, path in files:
                  zf.write(path, rel)
          PY
      - name: Hash release artifacts
        run: sha256sum dist/*.whl dist/*.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nolane-memory-0.6.3rc4
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.zip
            dist/SHA256SUMS.txt
            docs/FULL_SPEC_GATE_RC4.json
            docs/SPEC_COVERAGE_LEDGER.json
            docs/RC4_RELEASE_PROVENANCE.md
